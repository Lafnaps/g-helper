name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Check tag matches version
      if: github.event_name == 'release'
      run: |
        $version = ([xml](Get-Content app/GHelper.csproj)).Project.PropertyGroup.AssemblyVersion
        $tag = "${{ github.event.release.tag_name }}"
        if ($tag -ne "v$version") { throw "Tag $tag does not match AssemblyVersion $version" }

    - name: Publish
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    # The fork has no code-signing account, so binaries are released unsigned
    - name: Create ZIP
      run: powershell Compress-Archive app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe ./GHelper.zip

    - name: Upload EXE as workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: GHelper
        path: app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe

    - name: Upload EXE and ZIP to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe ./GHelper.zip --clobber

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe
          ./GHelper.zip
